<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Ring with Gold Accent -->
  <circle cx="21" cy="21" r="14" stroke="#080F1B" stroke-width="3.5" fill="#FFFFFF"/>
  <circle cx="21" cy="21" r="10" stroke="#B87927" stroke-width="1.8" stroke-dasharray="3 2" fill="none"/>
  
  <!-- Optical Lens Focus Crosshair -->
  <line x1="21" y1="13" x2="21" y2="17" stroke="#B87927" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="21" y1="25" x2="21" y2="29" stroke="#B87927" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="13" y1="21" x2="17" y2="21" stroke="#B87927" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="25" y1="21" x2="29" y2="21" stroke="#B87927" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="21" cy="21" r="2.5" fill="#080F1B"/>

  <!-- Magnifying Handle with Metallic Gold Collar -->
  <rect x="30.5" y="30.5" width="4.5" height="4" rx="1" transform="rotate(45 30.5 30.5)" fill="#B87927"/>
  <line x1="31" y1="31" x2="43" y2="43" stroke="#080F1B" stroke-width="4.5" stroke-linecap="round"/>
</svg>
